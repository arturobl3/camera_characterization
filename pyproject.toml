[project]
name = "camchar"
version = "0.1.0"
description = "Camera PTC characterization toolkit (EMVA 1288 / photon transfer)"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
]

[project.scripts]
camchar = "camchar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
